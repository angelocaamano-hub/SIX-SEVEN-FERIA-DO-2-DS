<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira do 2°DS - Desenvolvimento de Sistemas</title>
    <!-- Fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset e Configuração Geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Principal (Card Profissional) */
        .container {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* Títulos */
        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Seção de Ações / Botões */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .btn-secondary {
            background-color: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
        }

        .btn-secondary:hover {
            background-color: #475569;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Estilização da Imagem */
        .image-card {
            margin-top: 24px;
            display: inline-block;
            position: relative;
        }

        img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%; /* Formato circular para visual mais profissional */
            border: 4px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.05);
            border-color: #2563eb;
        }
    </style>
</head>

<body>

    <main class="container">
        <span class="badge">Feira de Profissões</span>
        
        <h1>Curso de Desenvolvimento de Sistemas</h1>
        
        <p class="description">
            Seja bem-vindo ao nosso quiz interativo! Teste seus conhecimentos sobre a área de tecnologia ou explore mais detalhes sobre a grade do curso.
        </p>
        
        <div class="actions">
            <!-- Botão Principal: Quiz -->
            <a href="pergunta1.html" class="btn btn-primary">
                <span>Fazer o Quiz</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            
            <!-- Botão Secundário: Informações -->
            <a href="Informações curso.html" class="btn btn-secondary">
                <span>Informações do Curso</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8h.01M12 12v4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </a>
        </div>

        <div class="image-card">
            <img src="abc.png" alt="Desenvolvimento / abc">
        </div>
    </main>

</body>
</html>
